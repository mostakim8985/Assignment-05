<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Github Issues Tracker</title>
    <!-- google font connected  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- tailwind and daisyui connected -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="icon" href="assets/github-logo.png" type="image/x-icon">

</head>

<body class="flex p-5 h-screen w-screen items-center justify-center">

    <fieldset class="fieldset bg-base-200 rounded-box drop-shadow-2xl shadow-amber-950 w-xl p-4 space-y-3">
        <div class="text-center space-y-4">
            <div>
                <img class="w-fit mx-auto" src="assets/github-logo.png" alt="">
            </div>
            <div>

                <h2 class="text-2xl font-semibold">Github Issues Tracker</h2>
                <p class="text-[#64748B] text-[16px]">Sign in to manage your issues</p>
            </div>
        </div>
        <div class="space-y-2 flex flex-col">
            <label class="font-medium text-[16px]">Username</label>
            <input id="userName" type="text" class="input w-full" placeholder="Enter Username" />
            <label class="text-[#4A00FF] text-[14px]">Default: admin</label>
        </div>
        <div class="space-y-2 flex flex-col">
            <label class="font-medium text-[16px]">Password</label>
            <input id="password" type="password" class="input w-full" placeholder="Enter Password" />
            <label class="text-[#4A00FF] text-[14px]">Default: admin123</label>
        </div>

        <button id="loginBtn" class="btn btn-primary mt-4">Login</button>

        <div class="flex items-center my-4">
            <div class="grow border-t border-gray-300"></div>

            <span class="mx-4 shrink text-gray-600 font-medium text-sm">OR</span>

            <div class="grow border-t border-gray-300"></div>
        </div>
        <div class="text-center space-y-4">
            <p class="text-[16px] text-[#64748B]">Demo Credentials</p>
            <div>
                <p class="font-semibold text-[16px]">Username: <span class="font-normal">admin</span></p>
                <p class="font-semibold text-[16px]">Password: <span class="font-normal">admin123</span></p>
            </div>
        </div>

    </fieldset>


<script src="login.js"></script>
</body>

</html>
